version: '3'

tasks:
  check:
    desc: 'Check code'
    cmds:
      - vp run check

  check:fix:
    desc: 'Fix code'
    cmds:
      - vp run check --fix

  gen:
    desc: 'Generate OpenAPI client for frontend'
    cmds:
      - vp run openapi-ts

  dev:
    desc: 'Run React dev server'
    cmds:
      - vp run dev
