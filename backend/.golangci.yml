version: "2"

linters:
  enable:
    - bodyclose
    - copyloopvar
    - cyclop
    - dupl
    - dupword
    - errcheck
    - errorlint
    - exhaustruct_v5
    - exhaustive
    - gochecknoglobals
    - gocritic
    - gocyclo
    - gomodguard_v2
    - gosec
    - govet
    - ineffassign
    - misspell
    - modernize
    - noctx
    - staticcheck
    - unused
    - wsl_v5

  settings:
    wsl_v5:
      allow-first-in-block: true
      allow-whole-block: false
      branch-max-lines: 2
    govet:
      enable-all: true
      disable-all: false
    exhaustruct_v5:
      enforce-patterns:
        - ".*"
      optional-patterns:
        - ".*Setter$"
        - ".*Options$"
        - ".*Server$"
      ignore-patterns:
        - '.*/huma(/v2)?\.Operation$'
      allow-empty: false
      allow-empty-returns: false
      allow-empty-declarations: false
      allow-empty-blank-assignments: false
      explicit-mode: true

formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
    - golines
    - swaggo
