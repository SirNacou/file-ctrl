# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

output: prefixed

dotenv:
  - .env

vars:
  GREETING: Hello, world!

includes:
  backend:
    taskfile: backend/Taskfile.yml
    dir: backend
  frontend:
    taskfile: frontend/Taskfile.yml
    dir: frontend

tasks:
  default:
    cmds:
      - task --list
    silent: true

  dev:
    desc: Start dev environtment
    deps:
      - task: backend:dev
      - task: frontend:dev

  check:
    desc: Check all projects
    deps:
      - task: frontend:check
      - task: backend:check

  check:fix:
    desc: Fix all projects
    deps:
      - task: backend:check:fix
      - task: frontend:check:fix
