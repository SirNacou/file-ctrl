# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

output: prefixed

dotenv:
  - .env

vars:
  GREETING: Hello, world!

includes:
  backend:
    taskfile: backend/Taskfile.yml
    dir: backend
  frontend:
    taskfile: frontend/Taskfile.yml
    dir: frontend

tasks:
  default:
    cmds:
      - task --list
    silent: true

  dev:
    desc: Start dev environtment
    deps:
      - dev:backend
      - dev:frontend

  dev:backend:
    desc: Run Go backend with live reload (or go run)
    dir: backend
    cmd: air

  dev:frontend:
    desc: "Run React dev server"
    dir: frontend
    cmds:
      - bun run dev
  gen:openapi:
    desc: "Generate OpenAPI client for frontend"
    dir: frontend
    cmds:
      - bun run openapi-ts

  check:
    desc: Check all projects
    deps:
      - task: frontend:check

  check:fix:
    desc: Fix all projects
    deps:
      - task: frontend:check:fix
