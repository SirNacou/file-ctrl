name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call: # lets the release workflow reuse this

jobs:
  test-backend:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache-dependency-path: backend/go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: backend

      - name: Run Go Tests
        run: go test -v -race -cover ./...

  test-frontend:
    name: Frontend Tests & Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck / Lint
        run: bun run check

      - name: Run Vitest
        run: bun test
